<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Circular text path for the bottom arc -->
    <path id="textArc" d="M 50,250 A 200,200 0 0,0 450,250 A 200,200 0 0,0 50,250" />
    <linearGradient id="hillGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#387a4c" />
      <stop offset="100%" stop-color="#245934" />
    </linearGradient>
    <linearGradient id="roofOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f28e2b" />
      <stop offset="100%" stop-color="#d95f18" />
    </linearGradient>
    <linearGradient id="roofGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eec149" />
      <stop offset="100%" stop-color="#c99723" />
    </linearGradient>
  </defs>

  <!-- Outer circular frame border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#245934" stroke-width="6" stroke-dasharray="14 8" opacity="0.85" />
  <circle cx="250" cy="250" r="226" fill="#ffffff" stroke="#245934" stroke-width="4" />

  <!-- Center green village hill -->
  <circle cx="250" cy="235" r="160" fill="url(#hillGreen)" />

  <!-- Palm trees at the top of the hill -->
  <path d="M 195,190 Q 200,120 190,95 Q 194,93 198,120 Q 202,170 200,190 Z" fill="#6d543e" />
  <path d="M 190,95 Q 150,85 135,115 Q 155,100 190,95 Z" fill="#438656" />
  <path d="M 190,95 Q 165,65 150,55 Q 170,75 190,95 Z" fill="#2d6e3f" />
  <path d="M 190,95 Q 195,45 205,35 Q 202,65 190,95 Z" fill="#438656" />
  <path d="M 190,95 Q 225,65 240,75 Q 215,85 190,95 Z" fill="#2d6e3f" />

  <path d="M 245,180 Q 252,105 245,75 Q 249,73 255,105 Q 254,160 250,180 Z" fill="#6d543e" />
  <path d="M 245,75 Q 210,50 195,60 Q 220,70 245,75 Z" fill="#438656" />
  <path d="M 245,75 Q 235,35 240,20 Q 248,45 245,75 Z" fill="#2d6e3f" />
  <path d="M 245,75 Q 275,35 295,45 Q 270,60 245,75 Z" fill="#438656" />
  <path d="M 245,75 Q 295,70 310,95 Q 280,85 245,75 Z" fill="#2d6e3f" />
  <path d="M 245,75 Q 280,105 285,130 Q 265,105 245,75 Z" fill="#438656" />

  <!-- Village Huts -->
  <g id="hut-top-right">
    <ellipse cx="320" cy="205" rx="30" ry="16" fill="#7d6350" stroke="#ffffff" stroke-width="2" />
    <path d="M 285,195 L 320,135 L 355,195 Z" fill="url(#roofGold)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  </g>

  <g id="hut-center-upper">
    <ellipse cx="240" cy="245" rx="32" ry="18" fill="#755a47" stroke="#ffffff" stroke-width="2" />
    <path d="M 205,235 L 240,165 L 275,235 Z" fill="url(#roofOrange)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  </g>

  <g id="hut-left-center">
    <ellipse cx="190" cy="295" rx="35" ry="20" fill="#6c523f" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 150,285 L 190,195 L 230,285 Z" fill="url(#roofGold)" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" />
  </g>

  <g id="hut-front-left">
    <ellipse cx="125" cy="330" rx="58" ry="30" fill="#694e3b" stroke="#ffffff" stroke-width="3" />
    <path d="M 60,315 L 125,185 L 190,315 Z" fill="url(#roofOrange)" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <g id="hut-front-right">
    <ellipse cx="285" cy="365" rx="56" ry="30" fill="#694e3b" stroke="#ffffff" stroke-width="3" />
    <path d="M 220,350 L 285,240 L 350,350 Z" fill="url(#roofOrange)" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <path d="M 140,375 Q 180,410 240,395 Q 200,380 140,375 Z" fill="#245934" opacity="0.6" />

  <text fill="#245934" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="4.5">
    <textPath href="#textArc" startOffset="14%" text-anchor="middle">
      THE AGAHOZO SHALOM YOUTH VILLAGE
    </textPath>
  </text>
</svg>
